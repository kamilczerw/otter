[server]
host = "0.0.0.0"
port = 42011

[database]
url = "sqlite://data/budget.db"

[currency]
code = "PLN"
minor_unit_name = "grosz"
decimal_places = 2

[cors]
allowed_origins = ["http://localhost:5173", "http://192.168.99.10:5173"]

[ui.budget_bars]
# Color thresholds for budget bar visualization based on percentage spent (0-100 scale)
# 0% to green_threshold = green (on track)
# green_threshold to yellow_threshold = yellow (caution)
# above yellow_threshold = red (overspent)
green_threshold = 100
yellow_threshold = 110

# [transaction.import]
# `rules_file` names the hand-editable TOML file that holds CSV import
# categorization rules (also readable/writable live via the app's
# uncategorized-transactions review queue, with no server restart needed
# after an edit). Resolved relative to this file; absolute paths also work.
# Defaults to "rules.toml" next to this file when unset.
#
# rules_file = "rules.toml"
#
# Example `rules.toml` contents — a rule is an ordered, AND'ed list of
# criteria, each naming one of five fields (merchant/raw_type/city/country/
# description) and a match type (contains: substring, case/diacritic
# insensitive; or regex: unmodified regular expression):
#
# [[matching_rules]]
# category = "groceries"
# [[matching_rules.match]]
# field = "merchant"
# contains = "netto"
