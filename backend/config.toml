[server]
host = "0.0.0.0"
port = 42011

[database]
url = "sqlite://data/budget.db"

[currency]
code = "PLN"
minor_unit_name = "grosz"
decimal_places = 2

[cors]
allowed_origins = ["http://localhost:5173", "http://192.168.99.10:5173"]

[ui.budget_bars]
# Color thresholds for budget bar visualization based on percentage spent (0-100 scale)
# 0% to green_threshold = green (on track)
# green_threshold to yellow_threshold = yellow (caution)
# above yellow_threshold = red (overspent)
green_threshold = 100
yellow_threshold = 110

# To split categorization rules into their own file instead of inlining them
# below, list it under a top-level `include` (paths are resolved relative to
# this file; absolute paths also work):
# include = ["crates/csv_import/rules.toml"]

# [transaction.import]
# CSV import categorization rules, inline or pulled in via `include` above.
# Leaving unset means nothing categorizes; all imported transactions fall to
# "uncategorized".
#
# [[transaction.import.matching_rules]]
# category = "groceries"
# [transaction.import.matching_rules.match]
