[server]
host = "0.0.0.0"
port = 42011

[database]
url = "sqlite://data/budget.db"

[currency]
code = "PLN"
minor_unit_name = "grosz"
decimal_places = 2

[cors]
allowed_origins = ["http://localhost:5173", "http://192.168.99.10:5173"]

[ui.budget_bars]
# Color thresholds for budget bar visualization based on percentage spent (0-100 scale)
# 0% to green_threshold = green (on track)
# green_threshold to yellow_threshold = yellow (caution)
# above yellow_threshold = red (overspent)
green_threshold = 100
yellow_threshold = 110

